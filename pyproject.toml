[project]
name = "pitwall-ai"
version = "0.1.0"
description = "A Formula 1-style LoRA adapter for Qwen3-1.7B, with a fair three-arm evaluation."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56",
    "peft",
    "trl",
    "accelerate",
    "datasets",
    "huggingface_hub",
    "safetensors",
    "anthropic>=1.15.0",
]

[dependency-groups]
app = [
    "fastapi>=0.115",
    "gradio>=5",
    "uvicorn>=0.30",
]
dev = ["pytest"]
docs = [
    "matplotlib>=3.9",
    "pypandoc-binary>=1.17",
    "typst>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the app/ folder
markers = [
    "slow: loads the full model weights (minutes, several GB of memory)",
    "gpu: needs a CUDA GPU (run on RunPod)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["outputs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job; long string literals (HTML templates, prompts) stay whole

[tool.ruff.lint.isort]
known-first-party = ["pitwall", "app"]
